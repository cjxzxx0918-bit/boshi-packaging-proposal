<script>
const D=JSON.parse(document.getElementById('proposal-data').textContent),byId=id=>document.getElementById(id),params=new URLSearchParams(location.search);
const state={material:'pvc',scheme:'G01',color:'Green',spec:'all',view:'all'};
for(const key of ['material','scheme','color','spec','view']){const v=params.get(key);if(v)state[key]=v;}
if(!D.categories.some(c=>c.id===state.material))state.material='pvc';if(!D.schemes.some(s=>s.id===state.scheme)&&state.scheme!=='blank')state.scheme='G01';if(![...D.colors.map(c=>c.id),'Mixed'].includes(state.color))state.color='Teal';if(!D.specs.some(s=>s.id===state.spec)&&state.spec!=='all')state.spec='all';if(!['all','closed','open'].includes(state.view))state.view='all';
const url=r=>encodeURI(r.file)+'?v='+r.sha256.slice(0,12);let queue=[],viewerIndex=0,returnFocus=null;
function make(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text!==undefined)e.textContent=text;return e;}
function button(parent,label,key,value,swatch){const b=make('button','filter');b.type='button';b.dataset.key=key;b.dataset.value=value;if(swatch){const dot=make('span','swatch');dot.style.background='rgb('+swatch.join(',')+')';b.append(dot);}b.append(document.createTextNode(label));b.onclick=()=>{state[key]=value;render();};byId(parent).append(b);}
D.categories.forEach((c,i)=>{const b=make('button','material');b.type='button';b.dataset.key='material';b.dataset.value=c.id;b.append(make('small','',String(i+1).padStart(2,'0')),make('strong','',c.zh));b.onclick=()=>{state.material=c.id;state.spec='all';state.view='all';closeViewer();render();};byId('materials').append(b);});
D.schemes.forEach((s,i)=>{const b=make('button','scheme');b.type='button';b.dataset.key='scheme';b.dataset.value=s.id;b.append(make('span','number','DESIGN '+String(i+1).padStart(2,'0')),make('span','name',s.name),make('span','type',s.gradient?'六种单色 · 同色渐变':'六种单色 / 混色 · 纯色方案'));b.onclick=()=>{state.scheme=s.id;if(s.gradient&&state.color==='Mixed')state.color='Green';closeViewer();render();};byId('schemes').append(b);});
{const b=make('button','scheme');b.type='button';b.dataset.key='scheme';b.dataset.value='blank';b.append(make('span','number','STRUCTURE'),make('span','name','空白盒型'),make('span','type','保留原有结构与配色参考'));b.onclick=()=>{state.scheme='blank';closeViewer();render();};byId('schemes').append(b);}
D.colors.forEach(c=>button('colors',c.zh,'color',c.id,c.rgb));button('colors','混色','color','Mixed');button('specs','全部规格','spec','all');D.specs.forEach(s=>button('specs',s.zh,'spec',s.id));button('views','双视角','view','all');button('views','闭盒','view','closed');button('views','开盒 / 展开','view','open');
function imageLink(record,label,cls){const a=make('a',cls||'image-link');a.href=url(record);const im=make('img');im.src=encodeURI(record.thumb||record.file);im.sizes='(max-width:760px) 94vw, 780px';im.alt=label;im.loading='lazy';im.decoding='async';if(record.size){im.width=record.size[0];im.height=record.size[1];}a.append(im);const index=queue.length;queue.push({record,label});a.onclick=e=>{e.preventDefault();returnFocus=a;openViewer(index);};return a;}
function renderImage(r){const f=make('figure','render'),label=r.name+' / '+r.color_zh+' / '+r.view_zh;f.append(imageLink(r,label));const cap=make('figcaption');const link=make('a','', '下载大图 ↗');link.href=url(r);link.download='';cap.append(make('span','',r.view_zh),link);f.append(cap);if(r.note)f.append(make('p','render-note',r.note));return f;}
function printCard(spec,rows,scheme){
 const top=state.material!=='pvc',category=D.categories.find(c=>c.id===state.material),art=D.artworks.find(a=>a.id===rows[0].artwork_id);
 const section=make('section','proposal'),head=make('header','proposal-head'),title=make('div');
 title.append(make('h3','',scheme.name+' · '+(top?'10瓶装':D.spec_names[spec.id])),make('div','meta',top?category.zh+' · 顶面排版':spec.dimensions_cm.join(' × ')+' cm · 长 × 高 × 厚'));
 head.append(title,make('span','color-tag',top?'青绿色':state.color==='Mixed'?'随机混色':D.colors.find(c=>c.id===state.color).zh));section.append(head);
 const body=make('div','proposal-body'),renders=make('div','renders');rows.forEach(r=>renders.append(renderImage(r)));body.append(renders);
 const panel=make('aside','art-panel'),flat=make('div'),heading=make('div','panel-title'),flatLabel=top?'顶面平面稿':'正面平面稿';
 heading.append(make('h4','',flatLabel),make('span','',spec.zh));flat.append(heading,imageLink(art,scheme.name+' / '+spec.zh+' / '+art.color_zh+flatLabel,'checker'));
 const cap=make('div','art-caption');cap.append(make('span','',(top?'顶面印刷':scheme.gradient?'渐变方案':'纯色方案')+' · '+(state.color==='Mixed'?'混色沿用青绿色稿':art.color_zh)));
 const al=make('a','','下载配色稿 ↗');al.href=url(art);al.download='';cap.append(al);flat.append(cap);
 const concept=make('div','concept');concept.append(make('h4','','设计理念'));
 const strategy=top?D.top_strategies[state.material][scheme.id]:scheme.strategy;
 strategy.forEach(point=>{const p=make('p','concept-point');p.append(make('strong','concept-label',point.label+'｜'),document.createTextNode(point.text));concept.append(p);});
 panel.append(flat,concept);body.append(panel);section.append(body);return section;
}
function blankCard(spec,rows,category){const section=make('section','proposal blank'),head=make('header','proposal-head'),title=make('div');title.append(make('h3','',category.zh+' · '+(state.material==='pvc'?D.spec_names[spec.id]:'10瓶装')),make('div','meta',state.material==='pvc'?spec.dimensions_cm.join(' × ')+' cm · 长 × 高 × 厚':'现有空白结构参考'));head.append(title,make('span','color-tag',state.material==='pvc'?(state.color==='Mixed'?'随机混色':D.colors.find(c=>c.id===state.color).zh):'青绿色'));section.append(head);const grid=make('div','blank-grid');rows.forEach(r=>grid.append(renderImage(r)));section.append(grid);return section;}
function render(){
 const pvc=state.material==='pvc';if(!pvc){state.color='Teal';if(!['S01','S02','blank'].includes(state.scheme))state.scheme='S01';}
 const scheme=D.schemes.find(s=>s.id===state.scheme),printed=state.scheme!=='blank',gradient=printed&&scheme.gradient;
 if(gradient&&state.color==='Mixed')state.color='Green';
 document.querySelectorAll('button[data-key]').forEach(b=>{
  b.setAttribute('aria-pressed',String(state[b.dataset.key]===b.dataset.value));
  b.hidden=gradient&&b.dataset.key==='color'&&b.dataset.value==='Mixed'||!pvc&&b.dataset.key==='scheme'&&!['S01','S02','blank'].includes(b.dataset.value);
  if(b.dataset.key==='scheme'&&b.dataset.value!=='blank'){
   const s=D.schemes.find(s=>s.id===b.dataset.value);b.querySelector('.type').textContent=pvc?(s.gradient?'六种单色 · 同色渐变':'六种单色 / 混色 · 纯色方案'):'青绿色 · 10瓶 · 顶面排版';
  }
 });
 byId('schemes').hidden=false;byId('colors').hidden=!pvc;byId('specs').hidden=!pvc;
 const category=D.categories.find(c=>c.id===state.material);byId('section-title').textContent=pvc?'PVC可视化包装':category.zh;
 byId('section-subtitle').textContent=printed?(pvc?(scheme.gradient?'六种单色 · 瓶体与渐变同色配套':'六种单色同色上稿 · 混色沿用确认稿'):'青绿色 · 10瓶装 · 顶面排版 / 闭盒与展开'):'闭盒与展开 · 空白结构参考';
 const rows=(printed?D.printed:D.blanks).filter(r=>(r.category||'pvc')===state.material&&(!printed||r.scheme===state.scheme)&&(!pvc||r.color===state.color&&(state.spec==='all'||r.spec===state.spec))&&(state.view==='all'||r.view===state.view));
 byId('selection-label').textContent=printed?scheme.name+' · '+(pvc?(state.color==='Mixed'?'混色':D.colors.find(c=>c.id===state.color).zh):'青绿色 · 10瓶装'):category.zh+' · 空白盒型';
 byId('selection-count').textContent='当前 '+rows.length+' 张效果图'+(printed?' · 配对应'+(pvc?'正面':'顶面')+'稿':'');
 queue=[];const gallery=byId('gallery');gallery.replaceChildren();const specs=pvc?D.specs:[{id:'10',zh:'10瓶',dimensions_cm:null}];
 specs.forEach(s=>{const list=rows.filter(r=>r.spec===s.id);if(list.length)gallery.append(printed?printCard(s,list,scheme):blankCard(s,list,category));});
 if(!rows.length)gallery.append(make('div','empty','当前筛选暂无图片。'));
 const current=new URLSearchParams();for(const key of ['material','scheme','color','spec','view'])current.set(key,state[key]);history.replaceState(null,'',location.pathname+'?'+current.toString());
}
byId('share-link').onclick=async()=>{const b=byId('share-link');try{await navigator.clipboard.writeText(location.href);b.textContent='链接已复制 ✓';setTimeout(()=>{b.textContent='复制当前方案链接 ↗';},2200);}catch{b.textContent='请复制浏览器地址栏链接';}};
function openViewer(index){if(!queue.length)return;viewerIndex=(index+queue.length)%queue.length;const q=queue[viewerIndex];byId('viewer-image').src=url(q.record);byId('viewer-image').alt=q.label;byId('viewer-label').textContent=q.label;byId('viewer-download').href=url(q.record);byId('viewer').classList.add('open');document.body.style.overflow='hidden';byId('viewer').querySelector('.close').focus();}
function closeViewer(){byId('viewer').classList.remove('open');document.body.style.overflow='';if(returnFocus&&returnFocus.isConnected)returnFocus.focus();}
byId('viewer').querySelector('.close').onclick=closeViewer;byId('viewer').querySelector('.prev').onclick=()=>openViewer(viewerIndex-1);byId('viewer').querySelector('.next').onclick=()=>openViewer(viewerIndex+1);byId('viewer').onclick=e=>{if(e.target===byId('viewer'))closeViewer();};document.addEventListener('keydown',e=>{if(!byId('viewer').classList.contains('open'))return;if(e.key==='Escape')closeViewer();if(e.key==='ArrowLeft')openViewer(viewerIndex-1);if(e.key==='ArrowRight')openViewer(viewerIndex+1);if(e.key==='Tab'){const f=[...byId('viewer').querySelectorAll('button,a[href]')],first=f[0],last=f[f.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}});
const hero=D.cover||D.printed.find(r=>r.scheme==='G02'&&r.spec==='10'&&r.color==='Green'&&r.view==='closed');byId('cover-image').src=encodeURI(hero.thumb||hero.file);byId('cover-link').href=url(hero);byId('cover-link').onclick=e=>{e.preventDefault();const index=queue.length;queue.push({record:hero,label:D.cover?D.cover.title:'大字识别 · 10瓶常备装 · 绿色'});returnFocus=byId('cover-link');openViewer(index);};render();
</script></body></html>
